name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write
  actions: read

jobs:
  # 1. Fast build + test matrix
  build:
    name: build-${{ matrix.os }}-${{ matrix.config }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            preset: windows-msvc
            config: Release
          - os: windows
            runner: windows-latest
            preset: windows-msvc-debug
            config: Debug
          - os: linux
            runner: ubuntu-latest
            preset: linux-gcc
            config: Release
          - os: macos
            runner: macos-14
            preset: macos-clang
            config: Release
    steps:
      - uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.28"

      - name: Setup Ninja (Unix)
        if: runner.os != 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy cppcheck shellcheck
          pip install cmake-format --quiet

      - name: clang-format
        run: |
          echo "Checking C/C++ formatting..."
          find src tests -name "*.c" -o -name "*.h" | xargs clang-format --dry-run --Werror || (echo "::error::Run clang-format -i src/**/*.c src/**/*.h"; exit 1)

      - name: cmake-format
        run: |
          cmake-format --check CMakeLists.txt || echo "::warning::cmake-format check failed"

      - name: actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          level: error
          fail_on_error: true

      - name: shellcheck
        run: |
          if [ -f install.sh ]; then shellcheck install.sh; fi

      - name: cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability --error-exitcode=1 --inline-suppr --suppress=missingIncludeSystem -I src src/ || echo "::warning::cppcheck found issues"

      - name: Check gitignore
        run: |
          if git check-ignore -q build/xzero 2>/dev/null; then echo "build/ correctly ignored"; else echo "::error::build/ must be ignored"; exit 1; fi
          if [ -d vendor ] && [ -n "$(ls -A vendor 2>/dev/null)" ]; then echo "::error::vendor/ should be empty (deps via FetchContent)"; exit 1; fi

  # 2. Security — extensive
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: cpp
          queries: security-and-quality
      - name: Build (for CodeQL)
        run: |
          cmake --preset linux-gcc -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:cpp"

  trivy:
    name: Trivy FS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  gitleaks:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC

  # Optional OSSF Scorecard (read-only, warn)
  scorecard:
    name: OSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

  # 3. Gate — require all to pass
  gate:
    name: PR Gate
    runs-on: ubuntu-latest
    needs: [build, lint, codeql, trivy, gitleaks, dependency-review]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "build=${{ needs.build.result }} lint=${{ needs.lint.result }} codeql=${{ needs.codeql.result }} trivy=${{ needs.trivy.result }} gitleaks=${{ needs.gitleaks.result }} deps=${{ needs.dependency-review.result }}"
          if [ "${{ needs.build.result }}" != "success" ]; then echo "::error::build failed"; exit 1; fi
          if [ "${{ needs.lint.result }}" != "success" ]; then echo "::error::lint failed"; exit 1; fi
          if [ "${{ needs.codeql.result }}" != "success" ] && [ "${{ needs.codeql.result }}" != "skipped" ]; then echo "::error::CodeQL failed"; exit 1; fi
          if [ "${{ needs.trivy.result }}" != "success" ] && [ "${{ needs.trivy.result }}" != "skipped" ]; then echo "::warning::Trivy warnings"; fi
          echo "PR checks passed"

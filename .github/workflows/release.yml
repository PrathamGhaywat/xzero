name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            os: windows
            arch: x64
            msvc_arch: x64
            cmake_args: ""
            artifact: xzero-windows-x64.exe
            preset: windows-ninja

          - name: windows-arm64
            runner: windows-latest
            os: windows
            arch: arm64
            msvc_arch: x64_arm64
            cmake_args: ""
            artifact: xzero-windows-arm64.exe
            preset: windows-ninja

          - name: linux-x64
            runner: ubuntu-latest
            os: linux
            arch: x64
            artifact: xzero-linux-x64
            preset: linux-gcc

          - name: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            artifact: xzero-linux-arm64
            preset: linux-gcc

          - name: macos-x64
            runner: macos-13
            os: macos
            arch: x64
            artifact: xzero-macos-x64
            preset: macos-clang

          - name: macos-arm64
            runner: macos-14
            os: macos
            arch: arm64
            artifact: xzero-macos-arm64
            preset: macos-clang

    steps:
      - uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.28"

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Verify MSVC Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cl = Get-Command cl.exe -ErrorAction SilentlyContinue
          if (-not $cl) {
            Write-Host "MSVC not found, trying where.exe..."
            where.exe cl.exe || Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter cl.exe | Select-Object -First 3 | Format-List FullName
            throw "MSVC compiler not available after setup."
          }
          & cl.exe
          & cmake.exe --version
          & ninja --version
          $cl | Format-List

      - name: Ensure Ninja
        shell: bash
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            echo "Ninja not found, installing..."
            pip install ninja --quiet || pip3 install ninja --quiet || sudo apt-get update && sudo apt-get install -y ninja-build
          fi
          ninja --version
          which ninja || where ninja || echo "ninja at $(command -v ninja)"

      - name: Configure
        shell: bash
        run: cmake --preset ${{ matrix.preset }} ${{ matrix.cmake_args }} -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Prepare artifact (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if (-not $ver) { $ver = "${{ inputs.tag }}" }
          if (-not $ver -or $ver -eq "") { $ver = "dev" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # Ninja uses build/xzero.exe, VS uses build/Release/xzero.exe
          $exe = Get-ChildItem -Path build -Recurse -Filter xzero.exe | Select-Object -First 1
          if(-not $exe){ throw "xzero.exe not found in build/" }
          Copy-Item -Path $exe.FullName -Destination "dist/${{ matrix.artifact }}"
          Push-Location dist
          $hash = (Get-FileHash "${{ matrix.artifact }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}" | Out-File -Encoding ascii SHA256SUMS
          Compress-Archive -Path "${{ matrix.artifact }}",SHA256SUMS -DestinationPath "xzero-$ver-${{ matrix.os }}-${{ matrix.arch }}.zip" -Force
          Get-ChildItem

      - name: Prepare artifact (Unix)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          ver="${{ github.ref_name }}"
          if [ -z "$ver" ]; then ver="${{ inputs.tag }}"; fi
          if [ -z "$ver" ]; then ver="dev"; fi
          mkdir -p dist
          cp build/xzero "dist/${{ matrix.artifact }}" || cp build/Release/xzero "dist/${{ matrix.artifact }}" || cp build/xzero "dist/${{ matrix.artifact }}"
          chmod +x "dist/${{ matrix.artifact }}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${{ matrix.artifact }}" > SHA256SUMS)
          else
            (cd dist && shasum -a 256 "${{ matrix.artifact }}" > SHA256SUMS)
          fi
          tar -C dist -czf "xzero-${ver}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" "${{ matrix.artifact }}" SHA256SUMS
          ls -lh dist/ *.tar.gz || true
          ls -lh xzero-*.tar.gz || true
          mkdir -p upload
          mv "xzero-${ver}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" upload/
          cp dist/SHA256SUMS "upload/SHA256SUMS-${{ matrix.os }}-${{ matrix.arch }}.txt" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*
            upload/*
            xzero-*.zip
            xzero-*.tar.gz
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -R artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum xzero-* 2>/dev/null | tee SHA256SUMS || true
          cat SHA256SUMS || true
          ls -lh

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/xzero-*.zip
            artifacts/xzero-*.tar.gz
            artifacts/SHA256SUMS*
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
